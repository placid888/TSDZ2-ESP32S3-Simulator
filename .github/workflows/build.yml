name: Build ESP32-S3 Simulator

on:
  push:
    branches: [ "main", "feat/**" ]
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r pc/requirements.txt
      - run: python -m unittest discover -s pc -p test_server.py
      - run: cmake -S tests -B build-host && cmake --build build-host && ctest --test-dir build-host --output-on-failure
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        idf: [release-v5.1, v5.5.5]
        mode: [legacy, mock, disabled, spi]
    container: espressif/idf:${{ matrix.idf }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Flash Size and Build
        run: |
          . $IDF_PATH/export.sh
          cp sdkconfig.defaults sdkconfig.ci
          echo "CONFIG_PARTITION_TABLE_SINGLE_APP_LARGE=n" >> sdkconfig.ci
          echo "CONFIG_PARTITION_TABLE_CUSTOM=y" >> sdkconfig.ci
          echo "CONFIG_PARTITION_TABLE_CUSTOM_FILENAME=\"partitions.csv\"" >> sdkconfig.ci
          if [ "${{ matrix.mode }}" != legacy ]; then
            echo 'CONFIG_VIRTUAL_BENCH=y' >> sdkconfig.ci
            echo "CONFIG_BENCH_DAC_${{ matrix.mode == 'mock' && 'MOCK' || matrix.mode == 'disabled' && 'DISABLED' || 'SPI' }}=y" >> sdkconfig.ci
          fi
          export SDKCONFIG_DEFAULTS=sdkconfig.ci
          idf.py set-target esp32s3
          idf.py build

      - name: Upload Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-simulator-${{ matrix.idf }}-${{ matrix.mode }}
          path: |
            build/tsdz2_esp32s3_sim.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
