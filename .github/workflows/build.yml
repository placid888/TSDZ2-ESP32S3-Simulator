      - name: Configure Flash Size and Build
        run: |
          . $IDF_PATH/export.sh
          
          # 1. 寫入設定
          echo "CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y" >> sdkconfig.defaults
          echo "CONFIG_ESPTOOLPY_FLASHSIZE=\"16MB\"" >> sdkconfig.defaults
          echo "CONFIG_PARTITION_TABLE_CUSTOM=y" >> sdkconfig.defaults
          echo "CONFIG_PARTITION_TABLE_CUSTOM_FILENAME=\"partitions.csv\"" >> sdkconfig.defaults
          
          # 2. 設定目標與編譯
          idf.py set-target esp32s3
          idf.py build
          
          # 3. 自動合併成單一 bin 檔
          idf.py merge-bin -o build/merged-firmware.bin

      - name: Upload Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-simulator-binaries
          path: |
            build/merged-firmware.bin