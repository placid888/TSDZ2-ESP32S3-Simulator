name: Build ESP32-S3 Simulator

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.1

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Flash Size and Build
        run: |
          . $IDF_PATH/export.sh
          echo "CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y" >> sdkconfig.defaults
          echo "CONFIG_ESPTOOLPY_FLASHSIZE=\"16MB\"" >> sdkconfig.defaults
          echo "CONFIG_PARTITION_TABLE_CUSTOM=y" >> sdkconfig.defaults
          echo "CONFIG_PARTITION_TABLE_CUSTOM_FILENAME=\"partitions.csv\"" >> sdkconfig.defaults
          idf.py set-target esp32s3
          idf.py build

      - name: Upload Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-simulator-binaries
          path: |
            build/tsdz2_esp32s3_sim.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin